{% extends 'base.html' %}

{% block title %}Competence Reports{% endblock %}

{% block content %}
<h2 class="mb-4">Competence Reports</h2>

<!-- Filter Form -->
<form method="get" class="mb-4 row g-3" id="filterForm">
    <div class="col-md-4">
        <label for="disease" class="form-label">Disease</label>
        <select name="disease" id="disease" class="form-select">
            <option value="">All Diseases</option>
            {% for disease in diseases %}
            <option value="{{ disease.id }}" {% if selected_disease == disease.id %}selected{% endif %}>
                {{ disease.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="grade" class="form-label">Grade Type</label>
        <select name="grade" id="grade" class="form-select">
            <option value="all" {% if selected_grade == 'all' %}selected{% endif %}>All Grades</option>
            <option value="mentor" {% if selected_grade == 'mentor' %}selected{% endif %}>Mentor Grade</option>
            <option value="mentee" {% if selected_grade == 'mentee' %}selected{% endif %}>Mentee Grade</option>
        </select>
    </div>
    <div class="col-md-4 align-self-end">
        <button type="submit" class="btn btn-primary">Filter</button>
    </div>
</form>

<!-- Report Table -->
<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Disease</th>
            <th class="overall-col">Overall Avg</th>
            <th class="mentor-col">Mentor Avg</th>
            <th class="mentee-col">Mentee Avg</th>
        </tr>
    </thead>
    <tbody>
        <!-- Filled dynamically via JS -->
    </tbody>
</table>

<!-- Charts -->
<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm">
            <h5 class="card-title">Mentor Grade Distribution</h5>
            <canvas id="mentorPieChart"></canvas>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm">
            <h5 class="card-title">Mentee Grade Distribution</h5>
            <canvas id="menteeDoughnutChart"></canvas>
        </div>
    </div>
</div>

<!-- Export Buttons -->
<div class="mt-3">
    <a href="{% url 'reports:competence-export-excel' %}?{% if selected_disease %}disease={{ selected_disease }}&{% endif %}grade={{ selected_grade }}"
        class="btn btn-success">Export Excel</a>
    <a href="{% url 'reports:competence-export-pdf' %}?{% if selected_disease %}disease={{ selected_disease }}&{% endif %}grade={{ selected_grade }}"
        class="btn btn-danger">Export PDF</a>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const mentorCtx = document.getElementById('mentorPieChart').getContext('2d');
    const menteeCtx = document.getElementById('menteeDoughnutChart').getContext('2d');

    let mentorChart = new Chart(mentorCtx, {
        type: 'pie',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd'], borderWidth: 1 }] },
        options: { responsive: true, plugins: { legend: { position: 'top' } } }
    });

    let menteeChart = new Chart(menteeCtx, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#28a745','#ffc107','#17a2b8','#6f42c1','#fd7e14'], borderWidth: 1 }] },
        options: { responsive: true, plugins: { legend: { position: 'right' } } }
    });

    function fetchFilteredData() {
        const disease = document.getElementById('disease').value;
        const grade = document.getElementById('grade').value;

        fetch(`?disease=${disease}&grade=${grade}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(res => res.json())
        .then(data => {
            // Hide/show columns
            const showOverall = grade === 'all';
            const showMentor = grade === 'all' || grade === 'mentor';
            const showMentee = grade === 'all' || grade === 'mentee';

            document.querySelectorAll('.overall-col').forEach(el => el.style.display = showOverall ? '' : 'none');
            document.querySelectorAll('.mentor-col').forEach(el => el.style.display = showMentor ? '' : 'none');
            document.querySelectorAll('.mentee-col').forEach(el => el.style.display = showMentee ? '' : 'none');

            // Update table
            const tbody = document.querySelector('table tbody');
            tbody.innerHTML = '';
            const countRows = data.avg_grade_per_disease.length;
            let totalMentor = 0, totalMentee = 0;

            if(countRows === 0){
                tbody.innerHTML = '<tr><td colspan="4">No data available.</td></tr>';
            } else {
                data.avg_grade_per_disease.forEach(item => {
                    const overall = item.avg_mentor_grade && item.avg_mentee_grade ? ((item.avg_mentor_grade + item.avg_mentee_grade)/2).toFixed(2) : '-';
                    const row = `<tr>
                        <td>${item.competence__disease__name}</td>
                        <td class="overall-col">${overall}</td>
                        <td class="mentor-col">${item.avg_mentor_grade ? item.avg_mentor_grade.toFixed(2) : '-'}</td>
                        <td class="mentee-col">${item.avg_mentee_grade ? item.avg_mentee_grade.toFixed(2) : '-'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                    totalMentor += item.avg_mentor_grade || 0;
                    totalMentee += item.avg_mentee_grade || 0;
                });

                const overallTotal = showOverall ? ((totalMentor + totalMentee)/countRows/2).toFixed(2) : '';
                const totalRow = `<tr class="table-secondary fw-bold">
                    <td>Total / Average</td>
                    <td class="overall-col">${overallTotal}</td>
                    <td class="mentor-col">${showMentor ? (totalMentor / countRows).toFixed(2) : ''}</td>
                    <td class="mentee-col">${showMentee ? (totalMentee / countRows).toFixed(2) : ''}</td>
                </tr>`;
                tbody.innerHTML += totalRow;
            }

            // Update charts
            mentorChart.data.labels = showMentor ? data.mentor_grade_labels : [];
            mentorChart.data.datasets[0].data = showMentor ? data.mentor_grade_data : [];
            mentorChart.update();

            menteeChart.data.labels = showMentee ? data.mentee_grade_labels : [];
            menteeChart.data.datasets[0].data = showMentee ? data.mentee_grade_data : [];
            menteeChart.update();
        });
    }

    // Trigger fetch on filter change
    document.getElementById('disease').addEventListener('change', fetchFilteredData);
    document.getElementById('grade').addEventListener('change', fetchFilteredData);

    // Initial fetch
    fetchFilteredData();
});
</script>
{% endblock %}

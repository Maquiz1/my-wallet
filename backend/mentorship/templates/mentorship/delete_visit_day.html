{% extends 'base.html' %}

{% block title %}Logbook - Delete Visit Day{% endblock %}

{% block content %}
<h2 class="mb-4">Delete Visit Day: {{ visit_day.date|date:"M d, Y" }}</h2>

<form method="post">
  {% csrf_token %}
  <p>Are you sure you want to delete this Visit Day?</p>

  <div class="mt-3">
    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
    <a href="{% url 'mentorship:visit-detail' visit_day.visit.id %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}

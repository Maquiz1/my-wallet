{% extends 'base.html' %}

{% block title %}Logbook - Site List{% endblock %}

{% block content %}

<h2>Sites in {{ district.name }}</h2>
<ul>
  {% for site in sites %}
  <li><a href="{% url 'locations:site-detail' site.id %}">{{ site.name }}</a></li>
  {% endfor %}
</ul>
<a href="{% url 'district-list' district.region.id %}">← Back to districts</a>

{% endblock %}

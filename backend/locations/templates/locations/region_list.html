{% extends 'base.html' %}

{% block title %}Logbook - Region List{% endblock %}

{% block content %}
<h2>Regions</h2>
<ul>
    {% for country in countries %}
        <li><a href="{% url 'locations:region-detail' region.id %}">{{ region.name }}</a></li>
    {% empty %}
        <li>No countries available.</li>
    {% endfor %}
</ul>
{% endblock %}
